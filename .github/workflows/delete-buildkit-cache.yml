name: Delete buildkit cache

on:
  schedule:
    - cron: '0 14 * * 4' # JST Thu 23:00
  workflow_dispatch: {}

permissions: {}

jobs:
  delete-buildkit-cache:
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete buildkit blob cache
        uses: suer/gh-delete-actions-caches@7811da1d23c358b578f7d2d952a4dde7b7453ea1 # v0.0.8
        with:
          key-prefix: buildkit-blob-1-
