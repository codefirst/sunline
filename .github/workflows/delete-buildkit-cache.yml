name: Delete buildkit cache

on:
  schedule:
    - cron: '0 14 * * 4' # JST Thu 23:00
  workflow_dispatch: {}

permissions: {}

jobs:
  delete-buildkit-cache:
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete buildkit blob cache
        uses: suer/gh-delete-actions-caches@d34f555da0b66ae9aaa6f3c963ed3e30cb7a87e9 # v0.0.5
        with:
          key-prefix: buildkit-blob-1-
