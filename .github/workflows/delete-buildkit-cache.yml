name: Delete buildkit cache

on:
  schedule:
    - cron: '0 14 * * 4' # JST Thu 23:00
  workflow_dispatch: {}

permissions: {}

jobs:
  delete-buildkit-cache:
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete buildkit blob cache
        uses: suer/gh-delete-actions-caches@57dd49a39064ffbb5ae03bee211f39159580ed0a # v0.0.7
        with:
          key-prefix: buildkit-blob-1-
